name: AI workstream overlap audit

on:
  pull_request:
    paths:
      - 'scripts/report-open-pr-workstreams.mjs'
      - 'scripts/report-open-pr-workstreams.test.mjs'
      - '.github/workflows/agent-workstream-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify overlap classification
        run: node --test scripts/report-open-pr-workstreams.test.mjs
      - name: Report open PR overlap from trusted main (read-only)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/report-open-pr-workstreams.mjs >> "$GITHUB_STEP_SUMMARY"
