name: Isolated Custom Lineup signed browser QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-v2-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-browser-acceptance:
    if: github.ref == 'refs/heads/test/custom-v2-native-signed-browser-20261023'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build canonical runtime data
        run: pnpm data:runtime
      - name: Select canonical fixture player IDs
        id: fixtures
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const universe = JSON.parse(readFileSync('packages/baseball-data/reports/canonical-universe/canonical-player-universe.json', 'utf8'));
          const candidates = Array.isArray(universe) ? universe : universe.players;
          if (!Array.isArray(candidates)) throw new Error('Canonical QA player universe is unavailable');
          const ids = candidates.map(player => player.playerId ?? player.id).filter(id => /^ibp_[0-9a-f]{20}$/.test(id)).slice(0, 10);
          if (ids.length !== 10) throw new Error('Expected ten canonical fixture players');
          console.log('player_ids=' + ids.join(','));
          NODE
      - name: Create per-run QA signing secrets
        id: secrets
        run: |
          echo "progression=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"
          echo "budget=$(openssl rand -hex 32)" >> "$GITHUB_OUTPUT"
      - name: Install headless Chromium
        run: pnpm --filter @initial-baseball/web exec playwright install --with-deps chromium
      - name: Run signed browser acceptance against isolated QA Supabase
        env:
          CUSTOM_V2_QA_PROJECT_REF: iklbnlicgsxxhaoiscor
          SUPABASE_URL: https://iklbnlicgsxxhaoiscor.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CUSTOM_V2_QA_SUPABASE_SERVICE_ROLE_KEY }}
          DAILY_PROGRESSION_SECRET: ${{ steps.secrets.outputs.progression }}
          CUSTOM_LINEUP_CREATION_BUDGET_SECRET: ${{ steps.secrets.outputs.budget }}
          CUSTOM_LINEUP_V2_GAMEPLAY_TRANSPORT_ENABLED: 'true'
          CUSTOM_V2_QA_PUBLIC_CREATION: 'true'
          CUSTOM_LINEUP_PUBLIC_CREATION_ENABLED: 'true'
          CUSTOM_V2_QA_SIMULATED_VERCEL_INGRESS: 'true'
          CUSTOM_V2_QA_PLAYWRIGHT_MODULE: playwright
          CUSTOM_V2_QA_PLAYER_IDS: ${{ steps.fixtures.outputs.player_ids }}
        run: node apps/web/scripts/qa-custom-v2-hosted.mjs
