name: Isolated Custom Lineup signed browser QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-v2-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-browser-acceptance:
    if: github.ref == 'refs/heads/main'
    environment: qa-custom-signed-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Require restricted QA Environment secret before installing dependencies
        env:
          QA_SERVICE_ROLE: ${{ secrets.QA_CUSTOM_SIGNED_BROWSER_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$QA_SERVICE_ROLE" || { echo 'Missing qa-custom-signed-browser Environment secret'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Build app and canonical runtime data without database credentials
        env:
          DAILY_PROGRESSION_SECRET: build-only-not-used-for-qa-runtime-0123456789abcdef
        run: pnpm build:web
      - name: Select canonical fixture player IDs
        id: fixtures
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const universe = JSON.parse(readFileSync('packages/baseball-data/reports/canonical-runtime-payload/player-index.json', 'utf8'));
          const candidates = Array.isArray(universe) ? universe : universe.players;
          if (!Array.isArray(candidates)) throw new Error('Canonical QA player universe is unavailable');
          const ids = candidates.map(player => player.playerId ?? player.id).filter(id => /^ibp_[0-9a-f]{20}$/.test(id)).slice(0, 10);
          if (ids.length !== 10) throw new Error('Expected ten canonical fixture players');
          console.log('player_ids=' + ids.join(','));
          NODE
      - name: Install headless Chromium and browser driver
        run: |
          npm install --prefix /tmp/custom-v2-qa playwright@1.56.1
          /tmp/custom-v2-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Run signed browser acceptance against isolated QA Supabase
        env:
          CUSTOM_V2_QA_PROJECT_REF: iklbnlicgsxxhaoiscor
          SUPABASE_URL: https://iklbnlicgsxxhaoiscor.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_CUSTOM_SIGNED_BROWSER_SUPABASE_SERVICE_ROLE_KEY }}
          CUSTOM_LINEUP_V2_GAMEPLAY_TRANSPORT_ENABLED: 'true'
          CUSTOM_V2_QA_PUBLIC_CREATION: 'true'
          CUSTOM_LINEUP_PUBLIC_CREATION_ENABLED: 'true'
          CUSTOM_V2_QA_SIMULATED_VERCEL_INGRESS: 'true'
          CUSTOM_V2_QA_PLAYWRIGHT_MODULE: /tmp/custom-v2-qa/node_modules/playwright/index.mjs
          CUSTOM_V2_QA_PLAYER_IDS: ${{ steps.fixtures.outputs.player_ids }}
        run: |
          export DAILY_PROGRESSION_SECRET="$(openssl rand -hex 32)"
          export CUSTOM_LINEUP_CREATION_BUDGET_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$DAILY_PROGRESSION_SECRET"
          echo "::add-mask::$CUSTOM_LINEUP_CREATION_BUDGET_SECRET"
          node apps/web/scripts/qa-custom-v2-hosted.mjs
