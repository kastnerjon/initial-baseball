name: Custom v2 two-session creator race

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261014163000_add_custom_lineup_v2_atomic_completed_admission.sql'
      - 'supabase/migrations/20261026233000_add_custom_v2_verified_creator_owner.sql'
      - 'supabase/migrations/20261027003000_mark_custom_v2_creator_attempt_noncompetitive.sql'
      - 'supabase/tests/custom_v2_creator_race_bootstrap.sql'
      - 'scripts/qa-custom-v2-creator-concurrency.mjs'
      - '.github/workflows/custom-v2-creator-race.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261014163000_add_custom_lineup_v2_atomic_completed_admission.sql'
      - 'supabase/migrations/20261026233000_add_custom_v2_verified_creator_owner.sql'
      - 'supabase/migrations/20261027003000_mark_custom_v2_creator_attempt_noncompetitive.sql'
      - 'supabase/tests/custom_v2_creator_race_bootstrap.sql'
      - 'scripts/qa-custom-v2-creator-concurrency.mjs'
      - '.github/workflows/custom-v2-creator-race.yml'

permissions:
  contents: read

jobs:
  creator-race:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install PostgreSQL client if unavailable
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Load disposable schema and exact committed migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/custom_v2_creator_race_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014163000_add_custom_lineup_v2_atomic_completed_admission.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026233000_add_custom_v2_verified_creator_owner.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027003000_mark_custom_v2_creator_attempt_noncompetitive.sql
      - name: Assert real overlap and both conflict orders
        run: node scripts/qa-custom-v2-creator-concurrency.mjs
